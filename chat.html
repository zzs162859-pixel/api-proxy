<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try AI Chat — Student AI Proxy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        :root { --bg: #f5f5f7; --surface: #ffffff; --border: #e5e5e5; --text: #1d1d1f; --text-secondary: #86868b; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: var(--surface); border-bottom: 1px solid #e5e5e5; flex-shrink: 0; }
        .chat-header .back { text-decoration: none; color: var(--text-secondary); font-size: 0.9em; font-weight: 500; }
        .chat-header .back:hover { color: var(--text); }
        .chat-header .title { font-weight: 600; font-size: 0.95em; }
        .chat-header .calls-left { font-size: 0.8em; color: var(--text-secondary); }

        .chat-messages { flex: 1; overflow-y: auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 20px; }
        .message { display: flex; gap: 12px; max-width: 85%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.assistant { align-self: flex-start; }
        .avatar { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.75em; font-weight: 500; flex-shrink: 0; }
        .message.user .avatar { background: #1d1d1f; color: #fff; }
        .message.assistant .avatar { background: #f0f0f2; border: 1px solid #e0e0e0; }
        .bubble { padding: 12px 16px; border-radius: 14px; font-size: 0.9em; line-height: 1.5; }
        .message.user .bubble { background: #1d1d1f; color: #fff; }
        .message.assistant .bubble { background: #fff; border: 1px solid #e5e5e5; }

        .chat-input-area { padding: 16px 24px; background: var(--surface); border-top: 1px solid #e5e5e5; display: flex; gap: 10px; flex-shrink: 0; }
        .chat-input-area input { flex: 1; padding: 12px 16px; background: #f5f5f7; border: 1px solid #e0e0e0; border-radius: 12px; font-size: 0.9em; outline: none; font-family: inherit; }
        .chat-input-area input:focus { border-color: #1d1d1f; background: #fff; }
        .chat-input-area button { padding: 12px 20px; background: #1d1d1f; color: #fff; border: none; border-radius: 12px; font-weight: 500; cursor: pointer; font-size: 0.9em; font-family: inherit; }
        .chat-input-area button:disabled { background: #ccc; }
    </style>
</head>
<body>
    <div class="chat-header">
        <a href="index.html" class="back">← Back</a>
        <span class="title">Free Trial Chat</span>
        <span class="calls-left" id="callsBadge">10 calls left</span>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message assistant">
            <div class="avatar">AI</div>
            <div class="bubble">
                Hello! You have 10 free messages. Try asking me anything — coding, writing, or just a question you're curious about.<br><br>
                When you're ready for unlimited access, check out the $4.99 plan.
            </div>
        </div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()" id="sendBtn">Send</button>
    </div>

    <script>
        const API_URL = '/api/chat';
        const MAX_CALLS = 10;
        let callCount = 0;

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const msg = input.value.trim();
            if (!msg) return;

            if (callCount >= MAX_CALLS) {
                appendMessage('assistant', "Thanks for trying my AI tool! If you found it useful, consider subscribing for $4.99/month. There's a 24-hour refund policy — so there's really nothing to lose. I'd truly appreciate your support. ❤️ <a href='index.html#pricing'>View Plans</a>");
                input.value = '';
                updateBadge();
                return;
            }

            appendMessage('user', msg);
            input.value = '';
            btn.disabled = true;
            const thinking = appendMessage('assistant', '...');

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                thinking.remove();

                if (data.choices && data.choices[0]) {
                    appendMessage('assistant', data.choices[0].message.content);
                } else {
                    appendMessage('assistant', 'Sorry, something went wrong. Please try again.');
                }
                callCount++;
                updateBadge();
            } catch (err) {
                thinking.remove();
                appendMessage('assistant', 'Network error. Please try again.');
            }

            btn.disabled = false;
            input.focus();
        }

        function appendMessage(role, content) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div class="avatar">${role === 'user' ? 'You' : 'AI'}</div><div class="bubble">${content}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        function updateBadge() {
            const remaining = MAX_CALLS - callCount;
            document.getElementById('callsBadge').textContent = remaining <= 0 ? 'Trial used' : `${remaining} calls left`;
        }
    </script>
</body>
</html>
