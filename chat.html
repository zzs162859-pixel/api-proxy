<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try AI Chat — Student AI Proxy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --border: #e5e5e5;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --transition-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes subtlePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* iOS 风格顶部导航 */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .chat-header .back {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9em;
            font-weight: 500;
            transition: color 0.25s var(--transition-smooth);
        }
        .chat-header .back:hover { color: var(--text); }
        .chat-header .title {
            font-weight: 600;
            font-size: 0.95em;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .chat-header .calls-left {
            font-size: 0.8em;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.04);
            padding: 5px 12px;
            border-radius: 100px;
            transition: all 0.3s var(--transition-smooth);
        }

        /* 消息区域 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .message {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: messageIn 0.35s var(--transition-smooth) both;
        }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.assistant { align-self: flex-start; }
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            font-weight: 600;
            flex-shrink: 0;
            transition: transform 0.2s var(--transition-smooth);
        }
        .message.user .avatar { background: #1d1d1f; color: #fff; }
        .message.assistant .avatar { background: #f0f0f2; border: 1px solid #e0e0e0; color: #555; }
        .bubble {
            padding: 11px 15px;
            border-radius: 16px;
            font-size: 0.9em;
            line-height: 1.5;
            transition: all 0.3s var(--transition-smooth);
        }
        .message.user .bubble { background: #1d1d1f; color: #fff; border-bottom-right-radius: 6px; }
        .message.assistant .bubble { background: #fff; border: 1px solid #e8e8ed; color: #333; border-bottom-left-radius: 6px; }
        .message .bubble:hover { transform: translateY(-1px); }

        /* 思考中动画 */
        .thinking-dots {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }
        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #999;
            animation: subtlePulse 1.2s ease-in-out infinite;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

        /* 输入区 */
        .chat-input-area {
            padding: 14px 20px;
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(0,0,0,0.06);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            padding: 13px 18px;
            background: #f0f0f3;
            border: 1px solid transparent;
            border-radius: 24px;
            font-size: 0.9em;
            outline: none;
            font-family: inherit;
            transition: all 0.3s var(--transition-smooth);
        }
        .chat-input-area input:focus {
            border-color: #c0c0c4;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.03);
        }
        .chat-input-area button {
            padding: 13px 22px;
            background: #1d1d1f;
            color: #fff;
            border: none;
            border-radius: 24px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9em;
            font-family: inherit;
            transition: all 0.3s var(--transition-smooth);
        }
        .chat-input-area button:hover {
            background: #3a3a3c;
            transform: scale(1.03);
        }
        .chat-input-area button:active { transform: scale(0.96); }
        .chat-input-area button:disabled {
            background: #ccc;
            transform: none;
        }

        /* 滚动条美化 */
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body>
    <div class="chat-header">
        <a href="index.html" class="back">← Back</a>
        <span class="title">Free Trial Chat</span>
        <span class="calls-left" id="callsBadge">10 calls left</span>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message assistant" style="animation-delay: 0.1s;">
            <div class="avatar">AI</div>
            <div class="bubble">
                Hello! You have 10 free messages. Try asking me anything — coding, writing, or just a question you're curious about.<br><br>
                When you're ready for unlimited access, check out the $4.99 plan.
            </div>
        </div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()" id="sendBtn">Send</button>
    </div>

    <script>
        const API_URL = '/api/chat';
        const MAX_CALLS = 10;
        let callCount = 0;

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const msg = input.value.trim();
            if (!msg) return;

            if (callCount >= MAX_CALLS) {
                appendMessage('assistant', "Thanks for trying my AI tool! If you found it useful, consider subscribing for $4.99/month. There's a 24-hour refund policy — so there's really nothing to lose. I'd truly appreciate your support. ❤️ <a href='index.html#pricing'>View Plans</a>");
                input.value = '';
                updateBadge();
                return;
            }

            appendMessage('user', msg);
            input.value = '';
            btn.disabled = true;

            const thinkingEl = appendMessage('assistant', '<div class="thinking-dots"><span></span><span></span><span></span></div>');

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                thinkingEl.remove();

                if (data.choices && data.choices[0]) {
                    appendMessage('assistant', data.choices[0].message.content);
                } else {
                    appendMessage('assistant', 'Sorry, something went wrong. Please try again.');
                }
                callCount++;
                updateBadge();
            } catch (err) {
                thinkingEl.remove();
                appendMessage('assistant', 'Network error. Please try again.');
            }

            btn.disabled = false;
            input.focus();
        }

        function appendMessage(role, content) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div class="avatar">${role === 'user' ? 'You' : 'AI'}</div><div class="bubble">${content}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        function updateBadge() {
            const remaining = MAX_CALLS - callCount;
            const badge = document.getElementById('callsBadge');
            badge.textContent = remaining <= 0 ? 'Trial used' : `${remaining} calls left`;
            if (remaining <= 3 && remaining > 0) {
                badge.style.background = 'rgba(255,59,48,0.1)';
                badge.style.color = '#ff3b30';
            }
        }
    </script>
</body>
</html>
